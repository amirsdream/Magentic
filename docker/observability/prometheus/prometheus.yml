# Prometheus Configuration for Magentic
global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ============================================
  # Main Application
  # ============================================
  
  # Magentic API (main app)
  # On Linux, use 172.17.0.1 (docker0 bridge) or host network mode
  # On Mac/Windows, use host.docker.internal
  - job_name: 'magentic-api'
    static_configs:
      - targets: ['172.17.0.1:8000']  # Docker bridge gateway to host
    metrics_path: /metrics
    # Fallback for when the app isn't running - avoids scrape errors
    scrape_timeout: 5s

  # ============================================
  # MCP Infrastructure
  # ============================================

  # MCP Gateway - JSON metrics (not Prometheus format)
  # The gateway exposes /metrics but returns JSON, so we disable scraping
  # Metrics for MCP calls are tracked by the main app instead
  
  # NOTE: Individual MCP servers (database, filesystem, etc.) do not expose
  # Prometheus metrics. MCP tool call metrics are tracked by the main
  # Magentic API via mcp_requests_total counter.

  # Docker containers (via cAdvisor)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
